name: Daily Arcus Points Monitor

on:
  schedule:
    - cron: "0 12 * * *"  # daily at 12:00 UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        id: monitor
        run: |
          OUTPUT=$(python -m src.arcus_tracker.monitor)
          echo "$OUTPUT"
          # Extract whether changes were detected (simple check)
          if echo "$OUTPUT" | grep -q '"changes_detected": true'; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit history if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "Update monitor history [skip ci]"
          git push || true

      - name: Send Telegram alert if changes detected
        if: steps.monitor.outputs.changes == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="Arcus Points Monitor: Changes detected in official sources.\nCheck the repository for updates.\nhttps://github.com/demarco2016/arcus-points-tracker"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
